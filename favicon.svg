​<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D2B1F"/>
      <stop offset="55%" stop-color="#5C4033"/>
      <stop offset="100%" stop-color="#8B6B3D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D78C"/>
      <stop offset="100%" stop-color="#C9A14A"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>

  <!-- Subtle gold border -->
  <rect x="18" y="18" width="476" height="476" rx="96" ry="96" 
        fill="none" stroke="url(#gold)" stroke-width="10" opacity="0.75"/>

  <!-- Calendar top bar -->
  <rect x="110" y="95" width="292" height="58" rx="16" fill="url(#gold)"/>
  
  <!-- Calendar body outline -->
  <rect x="110" y="145" width="292" height="260" rx="16" 
        fill="none" stroke="url(#gold)" stroke-width="10"/>

  <!-- Big number 3 -->
  <text x="256" y="310" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="195" 
        font-weight="700" 
        fill="#F8EED9" 
        text-anchor="middle" 
        dominant-baseline="middle">3</text>

  <!-- Small label -->
  <text x="256" y="430" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="600" 
        fill="#E8C47A" 
        text-anchor="middle" 
        letter-spacing="3">PLANNER</text>
</svg>
