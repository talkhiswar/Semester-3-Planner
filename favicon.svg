<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TA</title>

  <!-- Ikon utama format SVG -->
  <link rel="icon" type="image/svg+xml" href="./TA_Icon.svg" />
  <!-- Fallback ikon untuk browser/perangkat yang membaca rel="shortcut icon" atau apple-touch-icon -->
  <link rel="shortcut icon" type="image/svg+xml" href="./TA_Icon.svg" />
  <link rel="apple-touch-icon" href="./TA_Icon.svg" />

  <style>
    :root {
      --bg-dark: #1b120e;
      --card-brown: #3b281f;
      --gold-border: #d6b477;
      --gold-text: #f2d6a0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: var(--bg-dark);
      color: var(--gold-text);
      font-family: Georgia, serif;
    }

    .brand-card {
      text-align: center;
      padding: 2rem;
      border-radius: 16px;
      background-color: var(--card-brown);
      border: 2px solid var(--gold-border);
    }

    .brand-card img {
      width: 100px;
      height: 100px;
      display: block;
      margin: 0 auto 1rem;
    }
  </style>
</head>
<body>
  <main class="brand-card">
    <img src="./TA_Icon.svg" alt="Ikon TA" />
    <h1>TA</h1>
  </main>
</body>
</html>
