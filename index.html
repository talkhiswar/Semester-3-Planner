<!DOCTYPE html>
<html lang="id" data-theme="ai">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Semester 3 Planner: jadwal kuliah Teknik Informatika STIKOM CKI Jakarta.">
<meta name="theme-color" id="metaTema" content="#0f1a3a">
<title>Semester 3 Planner</title>
<link id="ikon" rel="icon" type="image/svg+xml" href="">
<link rel="stylesheet" href="style.css">
</head>

<body>
<header class="hero">
<canvas id="jaring" aria-hidden="true"></canvas>
<div class="blob b1"></div>
<div class="blob b2"></div>

<div class="hero-inner">
<div>
<img class="foto" id="foto" src="foto.jpg" alt="Foto Muhammad Talkhis Al-Rawi">
<div class="foto-fallback" id="fotoFallback" hidden>MT</div>
</div>

<div class="hero-text">
<div class="badges">
<span class="badge">Semester 3 Planner</span>
<span class="chip-ai"><i class="dot"></i><em id="labelTema">AI mode</em></span>
</div>

<h1>Jadwal Kuliah Semester 3</h1>
<p class="tagline"><span id="ketik"></span><span class="caret"></span></p>
<p class="nama">Muhammad Talkhis Al-Rawi</p>
<p class="kampus">Teknik Informatika (S1) &middot; STIKOM CKI Jakarta</p>
</div>
</div>
</header>

<main>
<section class="stats" aria-label="Ringkasan jadwal">
<div class="stat"><b id="statMatkul">0</b><span>Mata kuliah</span></div>
<div class="stat"><b id="statHari">0</b><span>Hari kuliah</span></div>
<div class="stat"><b id="statDurasi">0</b><span>Total durasi</span></div>
</section>

<section class="toolbar" aria-label="Pencarian dan filter">
<div class="toolbar-atas">
<input type="search" id="cari" placeholder="Cari mata kuliah atau dosen..." aria-label="Cari mata kuliah atau dosen">
<button type="button" class="btn-tema" id="tema">Ganti tema</button>
</div>
<div class="chips" id="chips" aria-label="Filter hari"></div>
</section>

<p class="info" id="info"></p>
<section id="timeline" aria-live="polite"></section>
<p class="kosong" id="kosong" hidden>Tidak ada jadwal yang cocok dengan pencarianmu.</p>
</main>

<footer>
&copy; 2026 Semester 3 Planner &middot; Muhammad Talkhis Al-Rawi &middot; STIKOM CKI Jakarta
</footer>

<script src="script.js"></script>
</body>
</html>
